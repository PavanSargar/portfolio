name: Validate portfolio
on:
  push:
    branches: [v4, main]
  pull_request:
    branches: [v4, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SERVICE_ID: test_service
      NEXT_PUBLIC_TEMPLATE_ID: test_template
      NEXT_PUBLIC_USER_ID: test_public_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: yarn typecheck
      - run: yarn audit
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
